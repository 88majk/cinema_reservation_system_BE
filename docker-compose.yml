version: "3.7"

services:
  postgres:
    container_name: cinematick-database
    image: postgres:15
    environment:
      POSTGRES_DB: CinemaResSys
      POSTGRES_PASSWORD: Cinematickpage123
      PGDATA: /var/lib/postgresql/data
      POSTGRES_USER: cinema_admin
    volumes:
      - postgres:/data/postgres
    ports:
      - 1433
    networks:
      - spring-demo
    restart: unless-stopped
volumes:
  postgres:
    driver: local

networks:
  spring-demo:
    driver: bridge